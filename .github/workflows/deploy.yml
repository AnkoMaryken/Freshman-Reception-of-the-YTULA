# GitHub Actions 自动部署工作流
# 推送到 main 分支时自动构建并部署到 GitHub Pages

name: Deploy VitePress Site to GitHub Pages

on:
  # 推送到 main 分支时触发
  push:
    branches:
      - main
  # 支持手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保同时只有一个部署在运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建文档站点
        # GitHub Actions 是 Linux 干净环境，原生构建命令完全兼容，
        # 不受本地沙箱文件删除限制的影响
        run: |
          rm -rf docs/.vitepress/dist
          npx vitepress build docs

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
